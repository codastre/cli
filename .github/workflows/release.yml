name: release

# This workflow lives in the standalone mirror repo github.com/codastre/cli
# (the cli/ subtree of jflbr/codastre is mirrored to that repo's root). It builds
# and publishes the CLI binaries to a GitHub Release on codastre/cli whenever a
# semver tag arrives there — which the monorepo's mirror workflow pushes.
#
# Note: this file is INERT inside the monorepo (GitHub only runs workflows at the
# repo root, i.e. /.github/workflows). It activates only once mirrored to the root
# of codastre/cli.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GoReleaser creates the release + uploads assets in this repo

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
