# GoReleaser config for the `codastre` CLI.
#
# This file is the build config for the standalone mirror repo github.com/codastre/cli,
# where it sits at the repo root (the `cli/` subtree of the jflbr/codastre monorepo is
# mirrored to that repo's root, so go.mod/main.go are top-level there).
#
# Local dry-run from the monorepo:  make cli-release-snapshot
# Real release: tag the monorepo `vX.Y.Z` -> the mirror workflow syncs the tag to
# codastre/cli -> that repo's release workflow runs this config.
version: 2

project_name: codastre

before:
  hooks:
    - go mod download

builds:
  - id: codastre
    main: .
    binary: codastre
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/codastre/cli/cmd.version={{ .Version }}
      - -X github.com/codastre/cli/cmd.commit={{ .Commit }}
      - -X github.com/codastre/cli/cmd.date={{ .Date }}

archives:
  - id: codastre
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - NOTICE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
